spring.application.name=loan-servicing-management

server.port=8080

# "local" = fake ACH (no real money), sample data on startup, /api/v1/dev/** tools
spring.profiles.active=local



# DATABASE
# Create the database once in pgAdmin: CREATE DATABASE loan_servicing;

spring.datasource.url=jdbc:postgresql://localhost:5432/loan_servicing
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# false: services convert entities to DTOs inside their own transactions
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Each module has its own schema (auth, lender, borrower, loan, payment) - created automatically
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true


# LOGGING

logging.level.org.springframework.web=INFO
logging.level.com.loanservicing=INFO
# Uncomment to see SQL parameter values
#logging.level.org.hibernate.orm.jdbc.bind=TRACE


# JWT (same flow as LoanLinq)
# Login: POST /api/v1/auth/get_auth_token {username, password} -> {token, userid, ...}
# Every request sends the token in the "jwt" header (LoanLinq axios interceptor)
# Secret must be at least 32 characters. Expiration in ms: 86400000 = 24 hours (LoanLinq front-end also expires the session after 24h)

app.jwt.secret=local-dev-secret-change-me-it-must-be-32-chars-or-more
app.jwt.expiration=86400000


# CORS (React dev servers)

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173


# PAYMENTS
# fake = FakeAchGateway, no real bank transactions

app.ach.mode=fake
app.fees.nsf-fee=25.00


# NIGHTLY JOBS (sec min hour day month weekday)
# Can also be run anytime from /api/v1/dev/jobs/...

app.jobs.late-charges-cron=0 0 1 * * *
app.jobs.default-check-cron=0 15 1 * * *
app.jobs.ach-returns-cron=0 0 2 * * *
app.jobs.disbursements-cron=0 0 3 * * *
